spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=600000
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

tiles.downloader.mock.maxCallDuration=120000
tiles.downloader.mock.failureRate=0.1

objects.detector.mock.maxCallDuration=120000
objects.detector.mock.failureRate=0.1

admin.email=${ADMIN_EMAIL}

readme.monitor.name=readmeio
readme.monitor.version=1.2.1
readme.monitor.development=${README_MONITOR_IS_DEVELOPMENT}
readme.monitor.url=${README_MONITOR_URL}
readme.monitor.api-key=${README_MONITOR_API_KEY}
readme.webhook.secret=${README_WEBHOOK_SECRET}
lidar.index.api.url=${LIDAR_INDEX_API_URL}
city-json-processor.api.url=${CITY_JSON_PROCESSOR_API_URL}
mutation.detection.api.url=${MUTATION_DETECTION_API_URL}
detection.mutation.enabled=${DETECTION_MUTATION_ENABLED:false}
detection.inference.api.enabled=${DETECTION_INFERENCE_API_ENABLED:false}
geodata.api.url=${GEODATA_API_URL}
geodata.api.key=${GEODATA_API_KEY}
coverage.hd.max.precision.cm=5

inference.api.url=${INFERENCE_API_URL}
inference.api.key=${INFERENCE_API_KEY}
