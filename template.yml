AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: geo-jobs-archismart - Computation and API

Globals:
  Function:
    CodeUri: .
    Runtime: java21
    Tracing: Active
    Architectures:
      - arm64
    EventInvokeConfig:
      MaximumRetryAttempts: 0
    AutoPublishAlias: live
    SnapStart:
      ApplyOn: PublishedVersions
    VpcConfig:
      SecurityGroupIds:
        - !Sub '{{resolve:ssm:/bpartners-imagery/sg/id}}'
      SubnetIds:
        - !Sub '{{resolve:ssm:/bpartners-imagery/private/subnet1/id}}'
        - !Sub '{{resolve:ssm:/bpartners-imagery/private/subnet2/id}}'
    Environment:
      Variables:
        ENV: !Ref Env
        AWS_S3_BUCKET: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/s3/bucket-name}}'
        AWS_SES_SOURCE: lou@bpartners.app
        AWS_EVENTBRIDGE_BUS: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/eventbridge/bus-name}}'
        AWS_EVENT_STACK_1_SQS_QUEUE_URL: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/1/sqs/mailbox-queue-url}}'
        AWS_EVENT_STACK_2_SQS_QUEUE_URL: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/2/sqs/mailbox-queue-url}}'
        AWS_EVENT_STACK_3_SQS_QUEUE_URL: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/3/sqs/mailbox-queue-url}}'
        AWS_EVENT_STACK_4_SQS_QUEUE_URL: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/4/sqs/mailbox-queue-url}}'
        
        SENTRY_DSN: !Sub '{{resolve:ssm:/geo-jobs-archismart/sentry/dsn}}'
        SENTRY_ENVIRONMENT: !Ref Env
        TILES_DOWNLOADER_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/tiles/downloader/url}}'
        TILE_DETECTION_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/tiles/detection/url}}'
        ADMIN_API_KEY: !Sub '{{resolve:ssm:/bpartners-geo-jobs/${Env}/admin/api-key}}'
        ANNOTATOR_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/annotator/url}}'
        ANNOTATOR_API_KEY: !Sub '{{resolve:ssm:/geo-jobs/${Env}/annotator/api/key}}'
        ANNOTATOR_GEOJOBS_USER_INFO: !Sub '{{resolve:ssm:/geo-jobs/${Env}/annotator/user/info}}'
        TILES_DOWNLOADER_MOCK_ACTIVATED: !Sub '{{resolve:ssm:/geo-jobs/${Env}/tiles-downloader-activated}}'
        OBJECTS_DETECTOR_MOCK_ACTIVATED: !Sub '{{resolve:ssm:/geo-jobs/${Env}/objects-detector-activated}}'
        SPRING_DATASOURCE_URL: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/db/url}}'
        SPRING_DATASOURCE_USERNAME: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/db/username}}'
        SPRING_DATASOURCE_PASSWORD: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/db/password}}'
        README_MONITOR_IS_DEVELOPMENT: !Sub '{{resolve:ssm:/geo-jobs/${Env}/readme/monitor/is-development}}'
        README_MONITOR_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/readme/monitor/url}}'
        README_MONITOR_API_KEY: !Sub '{{resolve:ssm:/geo-jobs/${Env}/readme/monitor/apikey}}'
        ADMIN_EMAIL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/admin/email}}'
        README_WEBHOOK_SECRET: !Sub '{{resolve:ssm:/geo-jobs/${Env}/readme/webhook/secret}}'
        BPARTNERS_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/bpartners/api/url}}'
        GEOSERVER_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/geoserver/api/url}}'
        IGN_LIDAR_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/ign/lidar/api/url}}'
        ROOF_COVERING_DETECTION_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/covering/detection/api/url}}'
        GOOGLE_CAPTCHA_SECRET: !Sub '{{resolve:ssm:/geo-jobs/${Env}/google/captcha/secret}}'
        GOOGLE_CAPTCHA_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/google/captcha/url}}'
        OPEN_SOURCE_LIDAR_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/open-source/lidar/api/url}}'
        GOOGLE_GEOCODE_API_KEY: !Sub '{{resolve:ssm:/geo-jobs/${Env}/google/geocode/api-key}}'
        ROOFER_3D_BAG_BASE_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/roofer/3d-bag/base-url}}'
        ROOFER_3D_BAG_API_KEY: !Sub '{{resolve:ssm:/geo-jobs/${Env}/roofer/3d-bag/api-key}}'
        ROOFER_3D_BAG_COMPLEXITY_FACTOR: !Sub '{{resolve:ssm:/geo-jobs/${Env}/roofer/3d-bag/complexity-factor}}'
        LIDAR_INDEX_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/lidar/index/api/url}}'
Parameters:
  Env:
    Type: String

Resources:
  
  FrontalFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.bpartners.geojobs.handler.LambdaHandler::handleRequest
      MemorySize: 2048
      Timeout: 300
      Role: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/execution/role-arn}}'
      
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED


  WorkerFunction1:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.bpartners.geojobs.handler.MailboxEventHandler::handleRequest
      MemorySize: 1024
      Timeout: 900 #note(sqs-visibility)
      Role: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/execution/role-arn}}'
      Events:
        AllEvents:
          Type: SQS
          Properties:
            Queue: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/1/sqs/mailbox-queue-arn}}'
            BatchSize: 1
      ReservedConcurrentExecutions: 100

  WorkerFunction2:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.bpartners.geojobs.handler.MailboxEventHandler::handleRequest
      MemorySize: 2048
      Timeout: 900 #note(sqs-visibility)
      Role: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/execution/role-arn}}'
      Events:
        AllEvents:
          Type: SQS
          Properties:
            Queue: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/2/sqs/mailbox-queue-arn}}'
            BatchSize: 1
      ReservedConcurrentExecutions: 100

  WorkerFunction3:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.bpartners.geojobs.handler.MailboxEventHandler::handleRequest
      MemorySize: 1024
      Timeout: 900 #note(sqs-visibility)
      Role: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/execution/role-arn}}'
      SnapStart:
        ApplyOn: None
      EphemeralStorage:
        Size: 1024
      Events:
        AllEvents:
          Type: SQS
          Properties:
            Queue: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/3/sqs/mailbox-queue-arn}}'
            BatchSize: 1
      ReservedConcurrentExecutions: 10

  WorkerFunction4:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.bpartners.geojobs.handler.MailboxEventHandler::handleRequest
      MemorySize: 2048
      Timeout: 900 #note(sqs-visibility)
      Role: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/execution/role-arn}}'
      SnapStart:
        ApplyOn: None
      EphemeralStorage:
        Size: 1024
      Events:
        AllEvents:
          Type: SQS
          Properties:
            Queue: !Sub '{{resolve:ssm:/geo-jobs-archismart/${Env}/4/sqs/mailbox-queue-arn}}'
            BatchSize: 1
      ReservedConcurrentExecutions: 10

  ApiUrlSSM:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Join [ '', [ /geo-jobs-archismart/, !Ref Env, /api/url ] ]
      Type: String
      Value: !GetAtt FrontalFunctionUrl.FunctionUrl

Outputs:
  ApiUrl:
    Description: Url to access the frontal function
    Value: !GetAtt FrontalFunctionUrl.FunctionUrl
        
