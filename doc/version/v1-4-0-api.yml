openapi: 3.0.3

info:
  title: Birdia API
  description: |
    Detect and qualify geo-referenced objects.
    
    # Versioning
    This API uses semantic versioning (MAJOR.MINOR.PATCH). Available versions are : 
    - [v1.4.0 (2026-10-26)](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/b-partners/geo-jobs/prod/doc/version/v1-4-0-api.yml) *(current)*
    - [v1.3.6 (2026-09-17)](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/b-partners/geo-jobs/prod/doc/version/v1-3-6-api.yml)
    - [v1.3.5 (2026-05-12)](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/b-partners/geo-jobs/prod/doc/version/v1-3-5-api.yml)
    - [v1.3.4 (2026-03-31)](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/b-partners/geo-jobs/prod/doc/version/v1-3-4-api.yml)
    - [v1.3.3 (2026-03-11)](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/b-partners/geo-jobs/prod/doc/version/v1-3-3-api.yml)
    - [v1.3.2 (2026-02-25)](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/b-partners/geo-jobs/prod/doc/version/v1-3-2-api.yml)
    - [v1.3.1 (2026-02-20)](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/b-partners/geo-jobs/prod/doc/version/v1-3-1-api.yml)
    - [v1.3.0 (2026-02-16)](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/b-partners/geo-jobs/prod/doc/version/v1-3-api.yml) 
    - [v1.2.0 (2025-12-10)](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/b-partners/geo-jobs/prod/doc/version/v1-2-api.yml) 
    - [v1.1.0 (2025-05-13)](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/b-partners/geo-jobs/prod/doc/version/v1-1-api.yml)
    - [v1.0.0 (2024-10-25)](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/b-partners/geo-jobs/prod/doc/version/v1-0-api.yml) *(deprecated)*
    
    # Security
    
    Get your **API key** by emailing **contact@birdia.fr**.
    All of your requests must embed your API key in the header named: **x-api-key**.
    
    # Glossary
    - *Detection* : process that involves analyzing images of a geographic area using an AI model. 
      Detection can be performed using a textual address, a GPS point, or a geographic zone.
      Its output may include detected objects in GeoJSON format, annotated images with detected object coordinates, or both.
    
    - *Parcel free delimitation* a.k.a. *Zone* : geographical area provided by consumer, in which is processed and delimited detection.
    
    - *Parcel constrained delimitation* a.k.a. *Parcel* : geographical area representing cadastral parcel of a land property, retrieved by API from provided textual address, GPS point or zone.
    
    - *GeoJSON format* : standard JSON-based format for encoding geographic data structures, such as FeatureCollections, Features, and geometries (Point, Polygon, MultiPolygon), where coordinates are expressed as longitude–latitude pairs.
    
    - *Pre-signed URL* : link allowing consumers to download file resources, such as detection result. _Link expires one hour_ after its generation.
    
    - *CityJSON* : an open, JSON-based encoding for storing, exchanging, and processing 3D city models. It is commonly used to enable applications and end users to visualize buildings and urban environments in 3D.
    
    - *Delimitation* : a geographic representation of an object (such as a building roof or a land parcel) expressed using GeoJSON coordinates. It is modeled generically as a Feature to describe any area or surface of interest.
    
    # Usage
    
    Submit your detection request through `POST /detections/{id}`
    where `{id}` is yours to be created.
    
    1. If your zone is described by a **GeoJson**, then just set accordingly the `geoJsonZone` field in the payload.
    2. If your zone is described by a **Shape file**, then upload it in a second call `POST /detections/{id}/shape`.
    3. If your zone is described by a list of addresses in an **Excel file**, then upload it in a second call `POST /detections/{id}/excel`.
    
    # Detection examples
    
    ### Detection on roof objects providing geojson multi-polygon geometry
    1. Submit detection request through `POST /detections/{id}` where `{id}` is yours to be created
    using the example request body accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/detection/geojson/detection_toiture_multi_polygon_payload_example.json).
    Note that `detectableObjectModelList` property must contain the `BP_TOITURE` model.
    2. Track the progress of your detection through `GET /detections/{id}`. 
    Detection is finished when `geoJsonUrl` property containing your detection result is not null.
    Expected API result example is accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/detection/geojson/detection-toiture-multi-polygon-api-response-example.json)
    Expected geojson example result is accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/detection/geojson/detection-toiture-multi-polygon-geojson-response-example.geojson)
    
    ### Detection on roof objects providing excel file containing textual addresses 
    1. Submit detection request through `POST /detections/{id}` where `{id}` is yours to be created
    using the example request body accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/detection/excel/detection_toiture_for_excel_process_payload_example.json).
    Note that `detectableObjectModelList` property must contain the `BP_TOITURE` model.
    2. Submit list of addresses contained inside an **Excel file** in a second call `POST /detections/{id}/excel`. 
    Example can be found [here](https://github.com/b-partners/geo-jobs/raw/refs/heads/preprod/examples/detection/excel/excel_addresses_example.xlsx)
    3. Track the progress of your detection through `GET /detections/{id}`.
    Detection is finished when `geoJsonUrl` property containing your detection result is not null.
    4. Processing time is variable due to address conversion.

    ### Detection on parcels including roof objects and trees providing geojson geometry
    1. Submit detection request through `POST /detections/{id}` where `{id}` is yours to be created
    using the example request body accessible [here](https://github.com/b-partners/geo-jobs/raw/refs/heads/preprod/examples/detection/detection_parcel_geojson_payload_example.json). 
    Especially, note that both `BP_TOITURE` and `BP_VEGETATION` must be specified during creation through `detectableObjectModelList` property.
    Also, `geoJsonDelimitationType` property must be set as `PARCEL_CONSTRAINED_DELIMITATION` to consider the zone's parcel.
    Provide your zone directly through the `geoJsonZone` property using point, polygon or multi-polygon geometry.
    In case you need to get images and its detections result for each detected feature, set `needsImageOutput` property to `true`.
    2. Track the progress of your detection through `GET /detections/{id}`.
    Once detection is on step POST_PROCESSING with status progression FINISHED and status health SUCCEEDED : 
    - Images result, if needed, can be obtained through each feature inside `geoJsonZone` where `original_image_url` allow to retrieve the feature's image and `vgg_url` detection results to be displayed on obtained image.
      Expected result can be found [here](https://github.com/b-partners/geo-jobs/raw/refs/heads/prod/examples/detection/toiture_and_vegetation_example_response.json).
    - GeoJson result can be obtained through `geoJsonUrl` and can be displayed on a map as QGIS.
    
    ### Detection on revetement and obstacles at 20 cm precision providing geojson polygon geometry
    1. Submit detection request through `POST /detections/{id}` where `{id}` is yours to be created
    using the example request body accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/detection/detection_revetement_obstacle_polygon_payload_example.json).
    Especially, note that `detectableObjectModelList` property must contain the `BP_REVETEMENT_OBSTACLE` model, which supports imagery layers of 5 cm and 20 cm.
    Do not provide `geoServerProperties`: imagery layer, and so its precision, is automatically selected from the zone location, here a zone covered by 20 cm imagery.
    Also, `geoJsonDelimitationType` property must be set as `USER_DEFINED_DELIMITATION` to use the provided polygon directly as the zone.
    Provide your zone directly through the `geoJsonZone` property using polygon geometry.
    In case you need to get images and its detections result for each detected feature, set `needsImageOutput` property to `true`.
    2. Track the progress of your detection through `GET /detections/{id}`.
    Once detection is on step POST_PROCESSING with status progression FINISHED and status health SUCCEEDED : 
    - Images result, if needed, can be obtained through each feature inside `geoJsonZone` where `original_image_url` allow to retrieve the feature's image and `vgg_url` detection results to be displayed on obtained image.
    - GeoJson result can be obtained through `geoJsonUrl` and can be displayed on a map as QGIS.
    Expected API result example is accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/detection/detection_revetement_obstacle_polygon_api_response_example.json).
    Expected VGG example result is accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/detection/vgg/revetement_obstacle_polygon_20cm.json).
    
    # 3D request examples
    
    ### Request 3D city models from textual, human-readable, addresses
    1. Submit a 3D request through `POST /3d/{id}/addresses` where `{id}` is yours to be created
    using the example request body accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/cityjson/city_json_addresses_request_example.json).
    2. Track the progress of your 3D request through `GET /3d/{id}`.
    When its status progression is `FINISHED` and status health `SUCCEEDED`, its attribute `cityJsonFileUrls` contains pre-signed URL to allow downloading cityJSON files.
    API response with result example can be found [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/cityjson/city_json_response_status_1_3_2_example.json).
    3. You can preview downloaded CityJSON file result through [https://ninja.cityjson.org](https://ninja.cityjson.org/).
    Expected city JSON example result is accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/cityjson/city_json_file_example.json).
    
    ### Request 3D city models on provided point
    1. Submit a 3D request through `POST /3d/{id}` where `{id}` is yours to be created
    using the example request body accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/cityjson/city_json_point_delimitation_request_v1_3_1_example.json).
    2. Track the progress of your 3D request through `GET /3d/{id}`.
    When its status progression is `FINISHED` and status health `SUCCEEDED`, its attribute `cityJsonFileUrls` contains pre-signed URL to allow downloading cityJSON files. 
    API response with result example can be found [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/cityjson/city_json_response_status_1_3_2_example.json).
    3. You can preview downloaded CityJSON file result through [https://ninja.cityjson.org](https://ninja.cityjson.org/).
    Expected city JSON example result is accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/cityjson/city_json_file_example.json).
    
    ### Request 3D city models on provided polygon
    1. Submit a 3D request through `POST /3d/{id}` where `{id}` is yours to be created
    using the example request body accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/cityjson/city_json_delimitation_request_v1_3_1_example.json).
    2. Track the progress of your 3D request through `GET /3d/{id}`.
    When its status progression is `FINISHED` and status health `SUCCEEDED`, its attribute `cityJsonFileUrls` contains pre-signed URL to allow downloading cityJSON files. 
    API response with result example can be found [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/cityjson/city_json_response_status_1_3_2_example.json).
    3. You can preview downloaded CityJSON file result through [https://ninja.cityjson.org](https://ninja.cityjson.org/).
    Expected city JSON example result is accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/cityjson/city_json_file_example.json).

  version: '1.4.0'

servers:
  - url: 'https://api.birdia.fr'
tags:
  - name: Usage
  - name: Image
  - name: Coverage
  - name: Detection
  - name: ThreeD
    description: Refers to 3D resources such as roof/building 3D model
paths:
  '/usage':
    get:
      tags:
        - Usage
      operationId: getDetectionUsage
      summary: Get detection usage
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: query
          name: surfaceUnit
          required: false
          schema:
            $ref: '#/components/schemas/DetectionSurfaceUnit'
      responses:
        200:
          description: Statistics of detection usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionUsage'
  '/detections':
    get:
      tags:
        - Detection
      operationId: getDetection
      summary: Get detections launched
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: query
          name: page
          schema:
            $ref: "#/components/schemas/Page"
        - in: query
          name: pageSize
          schema:
            $ref: "#/components/schemas/PageSize"
      responses:
        200:
          description: List of detections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Detection'
              examples:
                detections:
                  $ref: '#/components/examples/DetectionListResponse'
  '/image':
    get:
      tags:
        - Image
      summary: Retrieve an aerial image from a human-readable address or geographic coordinates.
      description: |
        Retrieve an aerial image by providing either a human-readable address
        or a pair of geographic coordinates (longitude and latitude). 
        
        When `ROOF_DAMAGE_DETECTION` is provided, only images with 5cm precision is supported.
      operationId: getImage
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: query
          name: usage
          schema:
            $ref: '#/components/schemas/ImageUsage'
          required: false
        - in: query
          name: address
          schema:
            type: string
          required: false
        - in: query
          name: longitude
          schema:
            type: number
          required: false
        - in: query
          name: latitude
          schema:
            type: number
          required: false
        - in: query
          name: zoom
          schema:
            $ref: '#/components/schemas/ImageZoomLevel'
          required: false
          description: Default value is BUILDING.
        - in: query
          name: isExtended
          schema:
            type: boolean
            default: true
          required: false
          deprecated: true
        - in: query
          name: shiftNb
          schema:
            type: integer
            default: 0
          required: false
      responses:
        200:
          description: Image details of provided address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDetails'
  '/detections/{id}':
    get:
      tags:
        - Detection
      operationId: getProcessedDetection
      summary: View recently processed detection actual status
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: Detection identifier
          required: true
      responses:
        200:
          description: Detection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
              examples:
                roofGeoJsonMultiPolygonResult:
                  $ref: '#/components/examples/DetectionRoofGeoJsonMultiPolygonResponse'
                parcelGeoJsonZoneResult:
                  $ref: '#/components/examples/DetectionParcelGeoJsonZoneResponse'
                revetementObstacleGeoJsonPolygon20cmResult:
                  $ref: '#/components/examples/DetectionRevetementObstacleGeoJsonPolygon20cmResponse'
    post:
      tags:
        - Detection
      operationId: processDetection
      summary: Create or process detection
      description: |
        Create detection and launch it if `geoJsonZone` provided.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: Detection identifier
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDetection'
            examples:
              roofGeoJsonMultiPolygon:
                $ref: '#/components/examples/DetectionRoofGeoJsonMultiPolygon'
              roofFromExcelAddresses:
                $ref: '#/components/examples/DetectionRoofFromExcelAddresses'
              parcelGeoJsonZone:
                $ref: '#/components/examples/DetectionParcelGeoJsonZone'
              revetementObstacleGeoJsonPolygon20cm:
                $ref: '#/components/examples/DetectionRevetementObstacleGeoJsonPolygon'
      responses:
        200:
          description: Detection created or launched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
              examples:
                roofGeoJsonMultiPolygonResult:
                  $ref: '#/components/examples/DetectionRoofGeoJsonMultiPolygonResponse'
                parcelGeoJsonZoneResult:
                  $ref: '#/components/examples/DetectionParcelGeoJsonZoneResponse'
                revetementObstacleGeoJsonPolygon20cmResult:
                  $ref: '#/components/examples/DetectionRevetementObstacleGeoJsonPolygon20cmResponse'
  '/detections/{id}/sync':
    post:
      tags:
        - Detection
      operationId: processDetectionSynchronously
      summary: Process detection synchronously
      description: |
        Intended for small areas such as an address. Tasks are processed simultaneously, delivering results in less than 90 seconds. 
        Results contains a image URL and vgg file URL, and can be requested through the GET /detections/{id} endpoint
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/IdentifierParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDetection'
            examples:
              roofGeoJsonPolygonSync:
                $ref: '#/components/examples/DetectionSyncRoofGeoJsonPolygon'
      responses:
        200:
          description: Detection created or processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
              examples:
                roofGeoJsonPolygonSyncResult:
                  $ref: '#/components/examples/DetectionSyncRoofGeoJsonPolygonResponse'
  '/detections/{id}/addresses':
    post:
      tags:
        - Detection
      summary: Submit detection over a list of textual addresses
      operationId: detectAddresses
      description: |
        Provide list of textual addresses to launch detection
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/IdentifierParameter'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Address'
      responses:
        200:
          description: Detection launched with provided textual addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
  '/detections/{id}/shape':
    post:
      tags:
        - Detection
      operationId: detectShapeFile
      summary: Submit detection over a shape file
      description: |
        Provide shape file to launch detection
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: Detection identifier
          required: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: Detection launched with provided shape file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
  '/detections/{id}/excel':
    post:
      tags:
        - Detection
      operationId: detectExcelFile
      summary: Submit detection over an excel file
      description: |
        Provide excel file containing textual addresses and launch detection.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: Detection identifier
          required: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: Detection with updated excel file uploaded url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
  '/city-jsons/{id}':
    get:
      deprecated: true
      tags:
        - ThreeD
      operationId: getRequestedCityJSONById
      parameters:
        - in: path
          name: id
          required: true
          description: CityJSONRequest unique id
          schema:
            type: string
      summary: Retrieve 3D city models request with its status
      description: Obtained 3D models file are cityJSON format.
      security:
        - ApiKeyAuth: [ ]
      responses:
        200:
          description: CityJSON files urls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityJSONRequest'
  '/city-jsons/{id}/process':
    put:
      deprecated: true
      tags:
        - ThreeD
      operationId: requestCityJSON
      parameters:
        - in: path
          name: id
          required: true
          description: CityJSONRequest unique id
          schema:
            type: string
      summary: Request 3D city models on provided roofs
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCityJSONRequest'
      responses:
        200:
          description: CityJSON files urls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityJSONRequest'
  '/3d/{id}':
    get:
      tags:
        - ThreeD
      operationId: getRequested3DFileById
      parameters:
        - in: path
          name: id
          required: true
          description: 3D requested identifier
          schema:
            type: string
      summary: Retrieve 3D models request with its status
      security:
        - ApiKeyAuth: [ ]
      responses:
        200:
          description: Retrieved 3D response with actual request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDResponseStatus'
              examples:
                3DResponseWithStatusSucceeded:
                  $ref: '#/components/examples/ThreeDResponseWithSucceededStatusExample'
    post:
      tags:
        - ThreeD
      operationId: request3DFileOnDelimitations
      parameters:
        - in: path
          name: id
          required: true
          description: 3D request identifier
          schema:
            type: string
      summary: Request 3D models on provided feature
      description: |
        ## Overview
        Request 3D models on provided Feature.
        ## Point Geometry Usage
        When `Point` geometry is provided, nearest `delimitationObjectType` such as BUILDING_ROOF is processed. Only PARCEL_FREE_DELIMITATION `delimitationType` is supported for now.
        ## Polygon and MultiPolygon Geometry Usage
        When `Polygon` or `MultiPolygon` geometry is provided, `delimitationObjectType` such as BUILDING_ROOF contained within the provided geometry is evaluated first. 
        Then, its intersection is computed according to the selected `delimitationType`.
        ### Case `delimitationType=USER_DEFINED_DELIMITATION`
        Provided geometry is used *directly* as the delimitation for the specified `delimitationObjectType` (for example, a BUILDING_ROOF delimitation)
        ### Case `delimitationType=PARCEL_CONSTRAINED_DELIMITATION`
        Provided geometry is first constrained by the land parcel. Resulting area is then used to retrieve the corresponding `delimitationObjectType` (for example, BUILDING_ROOF).
        ### Case `delimitationType=PARCEL_FREE_DELIMITATION`
        Provided geometry is used as a delimitation without any parcel constraint. Corresponding `delimitationObjectType` (for example, BUILDING_ROOF) is then retrieved from this area.
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreeDRequest'
            examples:
              3DRequestUsingPoint:
                $ref: '#/components/examples/ThreeDRequestUsingPointAndRoofTypeAndParcelFreeExample'
              3DRequestUsingPolygon:
                $ref: '#/components/examples/ThreeDRequestUsingPolygonAndRoofObjectTypeAndParcelFreeExample'
      responses:
        200:
          description: 3D response with actual request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDResponseStatus'
              examples:
                3DResponseWithStatusSucceeded:
                  $ref: '#/components/examples/ThreeDResponseWithSucceededStatusExample'
  '/3d/{id}/addresses':
    post:
      tags:
        - ThreeD
      operationId: request3DFileOnAddresses
      parameters:
        - in: path
          name: id
          required: true
          description: 3D request identifier
          schema:
            type: string
      summary: Request 3D models from a textual, human-readable, address
      description: |
        ## Overview
        Request 3D models from a textual, human-readable, address.
        ## Usage
        Its usage refers to Point geometry provided as Feature, as nearest `delimitationObjectType` such as BUILDING_ROOF is processed.
        Delimitation type is optional as only  PARCEL_FREE_DELIMITATION `delimitationType`, excluding land parcel, is supported for now.
        Delimitation object type is optional, as only BUILDING_ROOF `delimitationObjectType`, corresponding to building roof, is supported for now.
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ThreeDAddressesRequest'
            example:
              delimitationType: "PARCEL_FREE_DELIMITATION"
              delimitationObjectType: "BUILDING_ROOF"
              addresses:
                - fullText: "1 Rue de la Vau Saint-Jacques, 79200 Parthenay, France"

      responses:
        200:
          description: 3D response with actual request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDResponseStatus'
              examples:
                3DResponseWithStatusSucceeded:
                  $ref: '#/components/examples/ThreeDResponseWithProcessingStatusExample'
  '/coverage':
    get:
      tags:
        - Coverage
      operationId: getAreaCoverage
      summary: Check whether an address or a point is covered by HD imagery and by lidar data
      description: |
        Tells whether the location can be processed, either from 2D imagery or from lidar data (3D).
        Provide either a textual address, or point coordinates (longitude and latitude), but not both.

        - **Imagery**: the location is covered when at least one imagery layer is reachable, and `hd` when the
          best reachable layer has a 5 cm precision, the only precision supported by detection models.
        - **Lidar**: the location is covered when lidar files are available for it and their header can be read.

        When geodata providers cannot be reached, the response is a `504` and never a "not covered" result.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: query
          name: address
          required: false
          description: Address to check, resolved into a point
          schema:
            type: string
        - in: query
          name: longitude
          required: false
          schema:
            type: number
        - in: query
          name: latitude
          required: false
          schema:
            type: number
        - in: query
          name: types
          required: false
          description: Coverage types to check, both when none provided
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CoverageType'
      responses:
        200:
          description: Coverage of the location, only for the requested types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaCoverage'
        400:
          $ref: '#/components/responses/400'
        403:
          $ref: '#/components/responses/403'
        504:
          description: Geodata providers are unreachable, coverage cannot be determined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestException'
  '/keys':
    delete:
      tags:
        - Security
      operationId: revokeApiKey
      summary: Revoke all apiKey accesses
      security:
        - ApiKeyAuth: [ ]
      responses:
        200:
          description: Statistics of detection usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeApiKeyResponse'
