  responses:
    400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestException'
    403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotAuthorizedException'
  parameters:
    IdentifierParameter:
      in: path
      name: id
      schema:
        type: string
      description: Detection identifier
      required: true
  schemas:
    Page:
      type: integer
      description: Start at `1`
    PageSize:
      type: integer
      description: Cannot exceed `500`
    GeoServerProperties:
      type: object
      properties:
        geoServerUrl:
          type: string
        geoServerParameter:
          $ref: "#/components/schemas/GeoServerParameter"
    RevokeApiKeyResponse:
      type: object
      properties:
        message:
          type: string
    DetectionSurfaceUnit:
      type: string
      enum:
        - SQUARE_DEGREE
        - SQUARE_METER
    DetectionSurfaceValue:
      type: object
      required:
        - value
        - unit
      properties:
        value:
          type: number
          format: double
        unit:
          $ref: '#/components/schemas/DetectionSurfaceUnit'
    DetectionUsage:
      type: object
      required:
        - totalUsedSurface
        - remainingSurface
        - lastDatetimeSurfaceUsage
        - maxAuthorizedSurface
      properties:
        maxAuthorizedSurface:
          $ref: '#/components/schemas/DetectionSurfaceValue'
        totalUsedSurface:
          $ref: '#/components/schemas/DetectionSurfaceValue'
        remainingSurface:
          $ref: '#/components/schemas/DetectionSurfaceValue'
        lastDatetimeSurfaceUsage:
          type: string
          format: date-time
    StatusStatistic:
      type: object
      properties:
        progression:
          $ref: '#/components/schemas/ProgressionStatus'
        healthStatistics:
          type: array
          items:
            $ref: '#/components/schemas/HealthStatusStatistic'
    HealthStatusStatistic:
      type: object
      properties:
        health:
          $ref: '#/components/schemas/HealthStatus'
        count:
          type: number
    ProgressionStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - FINISHED
    HealthStatus:
      type: string
      enum:
        - SUCCEEDED
        - FAILED
        - UNKNOWN
        - RETRYING
    Status:
      type: object
      properties:
        progression:
          type: string
          enum:
            - PENDING
            - PROCESSING
            - FINISHED
        health:
          type: string
          enum:
            - SUCCEEDED
            - FAILED
            - UNKNOWN
            - RETRYING
        message:
          type: string
          description: Optional detail about the current status, mainly provided on failure.
        creationDatetime:
          type: string
          format: date-time

    ###########################################################################################################
    ###  GeoJSON objects. Modified from: https://gist.github.com/bubbobne/fe5f2db65acf039be6a9fd92fc9c7233  ###
    ###########################################################################################################

    GeoServerParameter:
      type: object
      properties:
        service:
          type: string
        request:
          type: string
        layers:
          type: string
        precisionLevelInCm:
          type: integer
          description: Ground precision of the served imagery, in centimeters.
        styles:
          type: string
        format:
          type: string
        transparent:
          type: boolean
        version:
          type: string
        width:
          type: integer
        height:
          type: integer
        srs:
          type: string
    Feature:
      type: object
      properties:
        type:
          type: string
          enum: [ Feature ]
        geometry:
          oneOf:
            - $ref: '#/components/schemas/Point'
            - $ref: '#/components/schemas/Polygon'
            - $ref: '#/components/schemas/MultiPolygon'
        properties:
          type: object
          additionalProperties: true
    Geometry:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - Point
            - Polygon
            - MultiPolygon
    Point2D:
      type: array
      maxItems: 2
      minItems: 2
      items:
        type: number
    Point:
      type: object
      allOf:
        - $ref: "#/components/schemas/Geometry"
      properties:
        coordinates:
          $ref: '#/components/schemas/Point2D'
    MultiPolygon:
      type: object
      allOf:
        - $ref: "#/components/schemas/Geometry"
      properties:
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                $ref: '#/components/schemas/Point2D'
    Polygon:
      type: object
      allOf:
        - $ref: "#/components/schemas/Geometry"
      properties:
        coordinates:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/Point2D'
    GeoJsonsUrl:
      type: object
      properties:
        url:
          type: string
        status:
          $ref: "#/components/schemas/Status"

    ###########################################################################################################
    ###  Detection components ############################################################################################
    ###########################################################################################################

    CreateDetection:
      type: object
      required:
        - emailReceiver
        - zoneName
      properties:
        emailReceiver:
          type: string
          description: |
            Email address that will be notified about detection steps evolution
        zoneName:
          type: string
          description: |
            Name that consumers provide to identify the zone
        geoServerProperties:
          allOf:
            - $ref: '#/components/schemas/GeoServerProperties'
          description: |
            Optional configuration properties for the geoserver.
            By default, API attributes automatically a default geoserver.
        detectableObjectModel:
          allOf:
            - $ref: '#/components/schemas/DetectableObjectModel'
          deprecated: true
          description: |
            DEPRECATED. Detection process could be done with multiple detectable object models now.
            To process detection with unique detectable object model, pass it through `detectableObjectModelList`.
        detectableObjectModelList:
          type: array
          items:
            $ref: '#/components/schemas/DetectableObjectModel'
          description: |
            List of detectable object model to be processed, use for the detection.
        geoJsonZone:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
          description: |
            Optional. If so, must provide zone by shape or excel file through its specific endpoint.
        geoJsonOutput:
          $ref: '#/components/schemas/GeoJsonOutput'
        geoJsonDelimitationType:
          $ref: '#/components/schemas/DelimitationType'
        needsImageOutput:
          type: boolean
          description: |
            When true, each detected address feature exposes its image and detection result through `original_image_url` and `vgg_url`.
    DelimitationType:
      type: string
      description: |
        By default delimitation type is PARCEL_FREE_DELIMITATION, earlier known as *ZONE* delimitation type.
        PARCEL_FREE_DELIMITATION, earlier known as *ZONE* delimitation, supported any BP models, permits consumer to provide either point/polygon/multi-polygon geometry
        USER_DEFINED_DELIMITATION, earlier known as *ROOF* delimitation, only supported with BP_TOITURE model for now, allows consumer to provide define delimitation (eg. roof for BP_TOITURE model), so API does not have to search for its inside provided zone;
        PARCEL_CONSTRAINED_DELIMITATION, earlier known as *PARCEL* delimitation, only supported with BP_TOITURE and BP_VEGETATION models for now, allows consumer to exclude parcels for each zone provided.
      enum:
        - USER_DEFINED_DELIMITATION
        - PARCEL_FREE_DELIMITATION
        - PARCEL_CONSTRAINED_DELIMITATION
        - ROOF
        - ZONE
        - PARCEL
    ImageZoomLevel:
      type: string
      enum:
        - BUILDING
        - NEIGHBORHOOD
        - DISTRICT
    Detection:
      allOf:
        - $ref: '#/components/schemas/CreateDetection'
      properties:
        id:
          type: string
        step:
          $ref: '#/components/schemas/DetectionStep'
        geoJsonUrl:
          type: string
        shapeUrl:
          type: string
        excelUrl:
          type: string
        imageUrl:
          type: string
        pdfUrl:
          type: string
        vggUrl:
          type: string
        addresses:
          type: array
          items:
            type: string
        imageProperties:
          $ref: '#/components/schemas/ImageProperties'
        imageTileInfoOrigin:
          $ref: '#/components/schemas/ImageTileInfo'
        roofDelimiter:
          $ref: '#/components/schemas/RoofDelimiter'
        creationDatetime:
          type: string
          format: date-time
    DetectionStepName:
      type: string
      enum:
        - REQUEST_ACCEPTED
        - TILING
        - MACHINE_DETECTION
        - POST_PROCESSING
    DetectionStepStatistic:
      allOf:
        - $ref: '#/components/schemas/StatusStatistic'
    DetectableObjectModel:
      type: object
      properties:
        modelName:
          $ref: '#/components/schemas/ModelName'
    ModelName:
      type: string
      description: |
        Possible values and included objects :
          - **BP_TOITURE** : Toiture, velux, panneau photovoltaique, moisissure, usure, fissure cassure, obstacle, cheminee, humidite, risque feu, ombre
          - **BP_LOM** : Passage piéton
          - **BP_ZAN** : Arbre, espace vert, toiture, voie carrossable, trottoir, parking
          - **BP_CLIMAT_RESILIENCE** : Parking, panneau photovoltaique
          - **BP_CONFIRMITE_PLU** : Bati, velux, panneau photovoltaique, Piscine
          - **BP_VOIRIE_TROTTOIRS** : Trottoir, voie carrossable
          - **BP_OLD** : Arbre, espace vert, toiture, voie carrossable, trottoir, parking, risquefeu
          - **BP_CYCL** : Pistes cyclables, symboles cyclables 
          - **BP_SIGN** : Marquages voiries
          - **BP_VEGETATION** : Espace vert, Espace arboré, arbre individualisé, canopée
          - **BP_TAMPONS** : Tampons de voiries, avaloirs, tampons hydroliques
          - **BP_CIMETIERE** : Cimetière, espace arboré, espace vert, tombe simple, tombe double, tombe non géométrique
          - **BP_STATIONNEMENT** : Parking
          - **BP_REVETEMENT_OBSTACLE** : Obstacle, cheminee, velux, panneau photovoltaique, lumineux
      enum:
        - BP_TOITURE
        - BP_LOM
        - BP_ZAN
        - BP_CLIMAT_RESILIENCE
        - BP_CONFIRMITE_PLU
        - BP_VOIRIE_TROTTOIRS
        - BP_OLD
        - BP_CYCL
        - BP_SIGN
        - BP_VEGETATION
        - BP_TAMPONS
        - BP_CIMETIERE
        - BP_STATIONNEMENT
        - BP_REVETEMENT_OBSTACLE
    DetectionStep:
      properties:
        name:
          $ref: '#/components/schemas/DetectionStepName'
        status:
          $ref: '#/components/schemas/Status'
        statistics:
          type: array
          items:
            $ref: '#/components/schemas/DetectionStepStatistic'
        updatedAt:
          type: string
          format: date-time
    Address:
      deprecated: true
      description: Only AddressFullText must be used to migrate actual Address to its new specification
      type: object
      properties:
        address:
          type: string
    AddressFullText:
      type: object
      properties:
        fullText:
          type: string
    ImageOfAddress:
      type: object
      properties:
        address:
          type: string
        imageBase64:
          type: string
    ImageProperties:
      type: object
      description: Image size properties are described in pixel.
      properties:
        width:
          type: integer
        height:
          type: integer
    ImageTileInfo:
      type: object
      description: Tile information of the origin image the detection was processed on.
      properties:
        size:
          $ref: '#/components/schemas/ImageProperties'
        coordinates:
          $ref: '#/components/schemas/TileCoordinates'
    RoofDelimiter:
      type: object
      description: |
        Optional. Mandatory only when doing sync detection using BP_TOITURE model.
      properties:
        polygon:
          type: array
          items:
            $ref: '#/components/schemas/Point2D'
    GeoJsonOutput:
      type: string
      description: |
        By default, detection output is a single GEO_JSON file, which can be displayed on a map such as QGIS, representing a single layer.
        If consumers want to separate result into multiple layers, a ZIP-compressed version is available, with each file representing a specific identified object and its corresponding map layer.
      enum:
        - GEO_JSON
        - ZIP
    ImageDetails:
      allOf:
        - $ref: '#/components/schemas/ImageOfAddress'
      properties:
        minTileCoordinates:
          $ref: '#/components/schemas/TileCoordinates'
        currentGeoPosition:
          $ref: '#/components/schemas/GeoPosition'
        zoomLevel:
          $ref: '#/components/schemas/ImageZoomLevel'
    CoverageType:
      type: string
      enum:
        - IMAGERY
        - LIDAR
    CoverageImageryLayer:
      type: object
      properties:
        name:
          type: string
        year:
          type: integer
        source:
          type: string
        precisionInCm:
          type: integer
    ImageryCoverage:
      type: object
      properties:
        covered:
          type: boolean
        hd:
          type: boolean
          description: True when the layer precision is 5 cm
        layer:
          $ref: '#/components/schemas/CoverageImageryLayer'
        supportedDetectableModels:
          type: array
          description: |
            Detectable object models that can run on the location, according to the precision of its imagery layer.
            A model is listed when all the object types it detects are supported at that precision.
            Unless the API key has the admin role, only the models it is authorized to use are listed.
          items:
            $ref: '#/components/schemas/DetectableObjectModel'
    LidarCoverage:
      type: object
      properties:
        covered:
          type: boolean
        region:
          type: string
          description: Region the lidar data comes from, e.g. FRANCE, SWITZERLAND or WALLONIA
        crs:
          type: string
          description: EPSG code of the coordinate reference system local to the region
        fileCount:
          type: integer
          description: Number of lidar files found for the location
    AreaCoverage:
      type: object
      properties:
        position:
          $ref: '#/components/schemas/GeoPosition'
        imagery:
          $ref: '#/components/schemas/ImageryCoverage'
        lidar:
          $ref: '#/components/schemas/LidarCoverage'
    RestException:
      type: object
      properties:
        type:
          type: string
        message:
          type: string
    BadRequestException:
      allOf:
        - $ref: '#/components/schemas/RestException'
      example:
        type: BadRequestException
        message: Bad request
    NotAuthorizedException:
      allOf:
        - $ref: '#/components/schemas/RestException'
      example:
        type: NotAuthorizedException
        message: Not authorized
    GeoPosition:
      type: object
      properties:
        longitude:
          type: number
        latitude:
          type: number
    TileCoordinates:
      type: object
      properties:
        x:
          type: integer
        y:
          type: integer
        z:
          type: integer
    ThreeDRequest:
      type: object
      properties:
        delimitations:
          description: Refers to a list of delimitations, such as roofs, to be previewed in 3D models. Only `Polygon` geometry are supported for now.
          type: array
          items:
            $ref: "#/components/schemas/Feature"
        delimitationObjectType:
          $ref: '#/components/schemas/DelimitationObjectType'
        delimitationType:
          $ref: '#/components/schemas/DelimitationType'
        complexityFactor:
          type: number
          description: |
            Number between 0 and 1. Actual default value is `0.66` when none provided. 
            Permits consumer to define complexity factor in lidar processing.
            More the given value approaches 1, more details will be provided in obtained preview 3D.
            Therefore, more the complexity approaches, more hallucination can be created.
    DelimitationObjectType:
      type: string
      enum:
        - BUILDING_ROOF
    CreateCityJSONRequest:
      deprecated: true
      allOf:
        - $ref: '#/components/schemas/ThreeDRequest'
      properties:
