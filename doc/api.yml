  '/3d/{id}':
    get:
      tags:
        - ThreeD
      operationId: getRequested3DFileById
      parameters:
        - in: path
          name: id
          required: true
          description: 3D requested identifier
          schema:
            type: string
      summary: Retrieve 3D models request with its status
      security:
        - ApiKeyAuth: [ ]
      responses:
        200:
          description: Retrieved 3D response with actual request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDResponseStatus'
              examples:
                3DResponseWithStatusSucceeded:
                  $ref: '#/components/examples/ThreeDResponseWithSucceededStatusExample'
    post:
      tags:
        - ThreeD
      operationId: request3DFileOnDelimitations
      parameters:
        - in: path
          name: id
          required: true
          description: 3D request identifier
          schema:
            type: string
      summary: Request 3D models on provided feature
      description: |
        ## Overview
        Request 3D models on provided Feature.
        ## Point Geometry Usage
        When `Point` geometry is provided, nearest `delimitationObjectType` such as BUILDING_ROOF is processed. Only PARCEL_FREE_DELIMITATION `delimitationType` is supported for now.
        ## Polygon and MultiPolygon Geometry Usage
        When `Polygon` or `MultiPolygon` geometry is provided, `delimitationObjectType` such as BUILDING_ROOF contained within the provided geometry is evaluated first. 
        Then, its intersection is computed according to the selected `delimitationType`.
        ### Case `delimitationType=USER_DEFINED_DELIMITATION`
        Provided geometry is used *directly* as the delimitation for the specified `delimitationObjectType` (for example, a BUILDING_ROOF delimitation)
        ### Case `delimitationType=PARCEL_CONSTRAINED_DELIMITATION`
        Provided geometry is first constrained by the land parcel. Resulting area is then used to retrieve the corresponding `delimitationObjectType` (for example, BUILDING_ROOF).
        ### Case `delimitationType=PARCEL_FREE_DELIMITATION`
        Provided geometry is used as a delimitation without any parcel constraint. Corresponding `delimitationObjectType` (for example, BUILDING_ROOF) is then retrieved from this area.
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreeDRequest'
            examples:
              3DRequestUsingPoint:
                $ref: '#/components/examples/ThreeDRequestUsingPointAndRoofTypeAndParcelFreeExample'
              3DRequestUsingPolygon:
                $ref: '#/components/examples/ThreeDRequestUsingPolygonAndRoofObjectTypeAndParcelFreeExample'
      responses:
        200:
          description: 3D response with actual request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDResponseStatus'
              examples:
                3DResponseWithStatusSucceeded:
                  $ref: '#/components/examples/ThreeDResponseWithSucceededStatusExample'
  '/3d/{id}/sync':
    post:
      tags:
        - ThreeD
      operationId: request3DFileOnDelimitationsSync
      parameters:
        - in: path
          name: id
          required: true
          description: 3D request identifier
          schema:
            type: string
      summary: Request 3D models on provided feature
      description: |
        ## Overview
        Request 3D models for the provided Features synchronously.
        ## Point Geometry Usage
        When `Point` geometry is provided, nearest `delimitationObjectType` such as BUILDING_ROOF is processed. Only PARCEL_FREE_DELIMITATION `delimitationType` is supported for now.
        ## Polygon and MultiPolygon Geometry Usage
        When `Polygon` or `MultiPolygon` geometry is provided, `delimitationObjectType` such as BUILDING_ROOF contained within the provided geometry is evaluated first. 
        Then, its intersection is computed according to the selected `delimitationType`.
        ### Case `delimitationType=USER_DEFINED_DELIMITATION`
        Provided geometry is used *directly* as the delimitation for the specified `delimitationObjectType` (for example, a BUILDING_ROOF delimitation)
        ### Case `delimitationType=PARCEL_CONSTRAINED_DELIMITATION`
        Provided geometry is first constrained by the land parcel. Resulting area is then used to retrieve the corresponding `delimitationObjectType` (for example, BUILDING_ROOF).
        ### Case `delimitationType=PARCEL_FREE_DELIMITATION`
        Provided geometry is used as a delimitation without any parcel constraint. Corresponding `delimitationObjectType` (for example, BUILDING_ROOF) is then retrieved from this area.
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreeDRequest'
            examples:
              3DRequestUsingPoint:
                $ref: '#/components/examples/ThreeDRequestUsingPointAndRoofTypeAndParcelFreeExample'
              3DRequestUsingPolygon:
                $ref: '#/components/examples/ThreeDRequestUsingPolygonAndRoofObjectTypeAndParcelFreeExample'
      responses:
        200:
          description: 3D response with actual request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDResponseStatus'
              examples:
                3DResponseWithStatusSucceeded:
                  $ref: '#/components/examples/ThreeDResponseWithSucceededStatusExample'
  '/3d/{id}/addresses':
    post:
      tags:
        - ThreeD
      operationId: request3DFileOnAddresses
      parameters:
        - in: path
          name: id
          required: true
          description: 3D request identifier
          schema:
            type: string
      summary: Request 3D models from a textual, human-readable, address
      description: |
        ## Overview
        Request 3D models from a textual, human-readable, address.
        ## Usage
        Its usage refers to Point geometry provided as Feature, as nearest `delimitationObjectType` such as BUILDING_ROOF is processed.
        Delimitation type is optional as only  PARCEL_FREE_DELIMITATION `delimitationType`, excluding land parcel, is supported for now.
        Delimitation object type is optional, as only BUILDING_ROOF `delimitationObjectType`, corresponding to building roof, is supported for now.
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ThreeDAddressesRequest'
            example:
              delimitationType: "PARCEL_FREE_DELIMITATION"
              delimitationObjectType: "BUILDING_ROOF"
              addresses:
                - fullText: "1 Rue de la Vau Saint-Jacques, 79200 Parthenay, France"

      responses:
        200:
          description: 3D response with actual request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDResponseStatus'
              examples:
                3DResponseWithStatusSucceeded:
                  $ref: '#/components/examples/ThreeDResponseWithProcessingStatusExample'
  '/geocode':
    get:
      tags:
        - Geocode
      operationId: geocodeAddress
      summary: Resolve an address into a GeoJSON Feature
      description: |
        Converts a textual address or point coordinates (longitude, latitude) into a geographic location and returns the result as a GeoJSON Feature.
        The service performs forward geocoding by querying external geocoding providers and transforms the response into a standardized GeoJSON Feature object.
      parameters:
        - in: query
          name: address
          required: false
          description: Address to geocode
          schema:
            type: string
        - in: query
          name: longitude
          required: false
          schema:
            type: number
        - in: query
          name: latitude
          required: false
          schema:
            type: number
      responses:
        200:
          description: GeoJSON Feature corresponding to address or point coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
  '/coverage':
    get:
      tags:
        - Coverage
      operationId: getAreaCoverage
      summary: Check whether an address or a point is covered by HD imagery and by lidar data
      description: |
        Tells whether the location can be processed, either from 2D imagery or from lidar data (3D).
        Provide either a textual address, or point coordinates (longitude and latitude), but not both.

        - **Imagery**: the location is covered when at least one imagery layer is reachable, and `hd` when the
          best reachable layer has a 5 cm precision, the only precision supported by detection models.
        - **Lidar**: the location is covered when lidar files are available for it and their header can be read.

        When geodata providers cannot be reached, the response is a `504` and never a "not covered" result.
      parameters:
        - in: query
          name: address
          required: false
          description: Address to check, resolved into a point
          schema:
            type: string
        - in: query
          name: longitude
          required: false
          schema:
            type: number
        - in: query
          name: latitude
          required: false
          schema:
            type: number
        - in: query
          name: types
          required: false
          description: Coverage types to check, both when none provided
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CoverageType'
      responses:
        200:
          description: Coverage of the location, only for the requested types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaCoverage'
        400:
          $ref: '#/components/responses/400'
        403:
          $ref: '#/components/responses/403'
        504:
          description: Geodata providers are unreachable, coverage cannot be determined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestException'
  '/geoCodingJobs/{id}':
    get:
      tags:
        - Geocode
      operationId: retrieveGeoCodingJobById
      summary: Retrieve a geo-coding job resolving list of addresses to GeoJSON features
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: GeoCodingJob with its status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoCodingJob'
  '/geoCodingJobs/{id}/excel':
    post:
      tags:
        - Geocode
      operationId: geocodeAddressesThroughExcelAddresses
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      summary: Resolve addresses contain inside provided excel file to GeoJSON Features
      description: |
        Converts list textual addresses inside provided excel file into a geographic location and returns the result as list of GeoJSON features.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                sheetIndex:
                  type: integer
                  description: Minimum value and default value is 1.
      responses:
        200:
          description: Created GeoCodingJob
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoCodingJob'

  /roof/overallScore:
    get:
      tags:
        - Roof
      operationId: computeRoofOverallScore
      summary: Compute overall roof degradation score and category
      description: |
        Computes the overall degradation score and corresponding category (A, B, C, D, E)
        of a roof based on humidite, usure, and moisissure rates.
      parameters:
        - in: query
          name: humiditeRate
          required: true
          schema:
            type: number
            description: Moisture rate of the roof area (0–100).

        - in: query
          name: usureRate
          required: true
          schema:
            type: number
            description: Wear rate of the roof area (0–100).

        - in: query
          name: moisissureRate
          required: true
          schema:
            type: number
            description: Mold rate of the roof area (0–100).
      responses:
        200:
          description: Computed roof score
          content:
            applicatin/json:
              schema:
                $ref: '#/components/schemas/RoofScore'
