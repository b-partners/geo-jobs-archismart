          required: true
          schema:
            type: number
            description: Wear rate of the roof area (0–100).

        - in: query
          name: moisissureRate
          required: true
          schema:
            type: number
            description: Mold rate of the roof area (0–100).
      responses:
        200:
          description: Computed roof score
          content:
            applicatin/json:
              schema:
                $ref: '#/components/schemas/RoofScore'
