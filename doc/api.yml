    ###########################################################################################################
    ###  GeoJSON objects. Modified from: https://gist.github.com/bubbobne/fe5f2db65acf039be6a9fd92fc9c7233  ###
    ###########################################################################################################
    GeoServerParameter:
      type: object
      properties:
        service:
          type: string
        request:
          type: string
        layers:
          type: string
        precisionLevelInCm:
          type: integer
        styles:
          type: string
        format:
          type: string
        transparent:
          type: boolean
        version:
          type: string
        width:
          type: integer
        height:
          type: integer
        srs:
          type: string

    Feature:
      type: object
      properties:
        type:
          type: string
          enum: [ Feature ]
        geometry:
          oneOf:
            - $ref: '#/components/schemas/Point'
            - $ref: '#/components/schemas/Polygon'
            - $ref: '#/components/schemas/MultiPolygon'
        properties:
          type: object
          additionalProperties: true
    Geometry:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - Point
            - Polygon
            - MultiPolygon

    Point2D:
      type: array
      maxItems: 2
      minItems: 2
      items:
        type: number

    Point:
      type: object
      allOf:
        - $ref: "#/components/schemas/Geometry"
      properties:
        coordinates:
          $ref: '#/components/schemas/Point2D'

    Polygon:
      type: object
      allOf:
        - $ref: "#/components/schemas/Geometry"
      properties:
        coordinates:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/Point2D'

    MultiPolygon:
      type: object
      allOf:
        - $ref: "#/components/schemas/Geometry"
      properties:
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                $ref: '#/components/schemas/Point2D'
    GeoJsonsUrl:
      type: object
      properties:
        url:
          type: string
        status:
          $ref: "#/components/schemas/Status"
    BucketSeparatorType:
      type: string
      enum:
        - UNDERSCORE
        - SLASH
    DetectionStepName:
      type: string
      enum:
        - REQUEST_ACCEPTED
        - TILING
        - MACHINE_DETECTION
        - POST_PROCESSING
    DetectionStepStatistic:
      allOf:
        - $ref: '#/components/schemas/StatusStatistic'
    DetectableObjectModel:
      type: object
      properties:
        modelName:
          $ref: '#/components/schemas/ModelName'
    ModelName:
      type: string
      description: |
        Possible values and included objects :
          - **BP_TOITURE** : Toiture, velux, panneau photovoltaique, moisissure, usure, fissure cassure, obstacle, cheminee, humidite, risque feu, ombre
          - **BP_LOM** : Passage piéton
          - **BP_ZAN** : Arbre, espace vert, toiture, voie carrossable, trottoir, parking
          - **BP_CLIMAT_RESILIENCE** : Parking, panneau photovoltaique
          - **BP_CONFIRMITE_PLU** : Bati, velux, panneau photovoltaique, Piscine
          - **BP_VOIRIE_TROTTOIRS** : Trottoir, voie carrossable
          - **BP_OLD** : Arbre, espace vert, toiture, voie carrossable, trottoir, parking, risquefeu
          - **BP_CYCL** : Pistes cyclables, symboles cyclables 
          - **BP_SIGN** : Marquages voiries
          - **BP_VEGETATION** : Espace vert, Espace arboré, arbre individualisé, canopée
          - **BP_TAMPONS** : Tampons de voiries, avaloirs, tampons hydroliques
          - **BP_CIMETIERE** : Cimetière, espace arboré, espace vert, tombe simple, tombe double, tombe non géométrique
          - **BP_STATIONNEMENT** : Parking, Place standard
      enum:
        - BP_TOITURE
        - BP_LOM
        - BP_ZAN
        - BP_CLIMAT_RESILIENCE
        - BP_CONFIRMITE_PLU
        - BP_VOIRIE_TROTTOIRS
        - BP_OLD
        - BP_CYCL
        - BP_SIGN
        - BP_VEGETATION
        - BP_TAMPONS
        - BP_CIMETIERE
        - BP_STATIONNEMENT
    CreateDetectionDebugMode:
      allOf:
        - $ref: '#/components/schemas/CreateDetection'
      properties:
        debugMode:
          type: boolean
    CreateDetection:
      type: object
      properties:
        emailReceiver:
          type: string
          description: |
            Email address that will be notified about detection steps evolution
        zoneName:
          type: string
          description: |
            Name that consumers provide to identify the zone
        geoServerProperties:
          $ref: '#/components/schemas/GeoServerProperties'
          description: Optional Configuration properties for the GeoServer.
        detectableObjectModel:
          $ref: '#/components/schemas/DetectableObjectModel'
        detectableObjectModelList:
          type: array
          items:
            $ref: '#/components/schemas/DetectableObjectModel'
          description: |
            List of model to be processed for the detection. 
            If empty or null, detection model will be retrieved from detectableObjectModel attribute.
        geoJsonZone:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
          description: |
            Optional. If so, must shape file or excel file or image file through its specific endpoint.
        geoJsonDelimitationType:
          allOf:
            - $ref: '#/components/schemas/DelimitationType'
        geoJsonOutput:
          $ref: '#/components/schemas/GeoJsonOutput'
        needsImageOutput:
          type: boolean
          default: false
        toNotify:
          type: boolean
          default: false
    DetectionStep:
      properties:
        name:
          $ref: '#/components/schemas/DetectionStepName'
        status:
          $ref: '#/components/schemas/Status'
        statistics:
          type: array
          items:
            $ref: '#/components/schemas/DetectionStepStatistic'
        updatedAt:
          type: string
          format: date-time
    CreateWebhook:
      properties:
        email:
          type: string
        readmeProject:
          type: string
    DetectionFileObject:
      type: object
      properties:
        fileName:
          type: string
        fileUrl:
          type: string
        fileType:
          $ref: '#/components/schemas/DetectionFileType'
    DetectionFileType:
      type: string
      enum:
        - TILE_IMAGE
        - TILE_MASK
        - TILE_DETECTION_RESULT_V1
        - TILE_DETECTION_RESULT_V2
    Detection:
      allOf:
        - $ref: '#/components/schemas/CreateDetection'
      properties:
        id:
          type: string
        step:
          $ref: '#/components/schemas/DetectionStep'
        geoJsonUrl:
          type: string
        shapeUrl:
          type: string
        excelUrl:
          type: string
        imageUrl:
          type: string
        imageProperties:
          $ref: '#/components/schemas/ImageProperties'
        imageTileInfoOrigin:
          $ref: '#/components/schemas/TileInfo'
        pdfUrl:
          type: string
        vggUrl:
          type: string
        addresses:
          type: array
          items:
            type: string
        roofDelimiter:
          $ref: '#/components/schemas/RoofDelimiter'
        creationDatetime:
          type: string
          format: date-time
    Prospect:
      type: object
      properties:
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        address:
          type: string
    Address:
      deprecated: true
      description: Only AddressFullText must be used to migrate actual Address to its new specification
      type: object
      properties:
        address:
          type: string
    AddressFullText:
      type: object
      properties:
        fullText:
          type: string
    ImageDetails:
      allOf:
        - $ref: '#/components/schemas/ImageOfAddress'
      properties:
        minTileCoordinates:
          $ref: '#/components/schemas/TileCoordinates'
        currentGeoPosition:
          $ref: '#/components/schemas/GeoPosition'
        zoomLevel:
          $ref: '#/components/schemas/ImageZoomLevel'
    GeoPosition:
      type: object
      properties:
        longitude:
          type: number
        latitude:
          type: number
    ImageOfAddress:
      type: object
      deprecated: true
      properties:
        address:
          type: string
        imageBase64:
          type: string
    RoofDelimiter:
      type: object
      description: |
        Optional. Mandatory only when doing sync detection using TOITURE model.
      properties:
        roofSlopeInDegree:
          type: number
        roofHeightInMeter:
          type: number
        polygon:
          type: array
          items:
            $ref: '#/components/schemas/Point2D'

    ThreeDRequest:
      type: object
      required:
        - delimitations
        - delimitationObjectType
        - delimitationType
      properties:
        delimitations:
          description: Refers to a list of features, such as point corresponding to a textual address or a polygon/multiPolygon corresponding to a roof delimitation, to be previewed in 3D models.
          type: array
          items:
            $ref: "#/components/schemas/Feature"
        delimitationObjectType:
          $ref: '#/components/schemas/DelimitationObjectType'
        delimitationType:
          $ref: '#/components/schemas/DelimitationType'
        complexityFactor:
          type: number
          description: |
            Number between 0 and 1. Actual default value is `0.66` when none provided. 
            Permits consumer to define complexity factor in lidar processing.
            More the given value approaches 1, more details will be provided in obtained preview 3D.
            Therefore, more the complexity approaches, more hallucination can be created.
        lidarProcessorType:
          $ref: '#/components/schemas/LidarProcessorType'
        knn:
          type: integer

    ThreeDTextureInfo:
      type: object
      required:
        - zoom
        - imageUri
        - imageWidth
        - imageHeight
        - tileX
        - tileY
        - tileImageSizePx
      properties:
        tileX:
          type: integer
        tileY:
          type: integer
        tileImageSizePx:
          type: integer
        imageWidth:
          type: integer
        imageHeight:
          type: integer
        zoom:
          type: integer
        imageUri:
          type: string

    DelimitationObjectType:
      type: string
      description: |
        By default delimitationObjectType is BUILDING_ROOF.
        BUILDING_ROOF represents a building-level delimitation using a global geometry (point/polygon/multi-polygon).
        BUILDING_ROOF_SEGMENT_FACE represents segments of a roof divided into multiple parts, each corresponding to a distinct sloping roof surface. Only polygon/multipolygon are supported.
      enum:
        - BUILDING_ROOF
        - BUILDING_ROOF_SEGMENT_FACE
      x-enum-varnames:
        - BUILDING_ROOF
        - BUILDING_ROOF_SEGMENT_FACE
    CreateCityJSONRequest:
      deprecated: true
      allOf:
        - $ref: '#/components/schemas/ThreeDRequest'
      properties:
        id:
          type: string
        threeDTextureInfo:
          $ref: "#/components/schemas/ThreeDTextureInfo"
    CityJSONRequestStatus:
      deprecated: true
      type: string
      x-enum-varnames:
        - FINISHED
        - FAILED
        - PROCESSING
        - UNAVAILABLE
      enum:
        - FINISHED
        - FAILED
        - PROCESSING
        - UNAVAILABLE
    LidarProcessorType:
      type: string
      enum:
        - DEFAULT
        - THREE_D_BAG_ROOFER
    ThreeDAddressesRequest:
      type: object
      properties:
        lidarProcessorType:
          $ref: '#/components/schemas/LidarProcessorType'
        delimitationType:
          $ref: '#/components/schemas/DelimitationType'
        delimitationObjectType:
          $ref: '#/components/schemas/DelimitationObjectType'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressFullText'
    ThreeDResponseStatus:
      allOf:
        - $ref: '#/components/schemas/ThreeDRequest'
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        step:
          $ref: '#/components/schemas/ThreeDRequestStep'
        cityJsonFileUrls:
          type: array
          items:
            $ref: '#/components/schemas/CityJsonFileUrl'
    ThreeDRequestStep:
      type: string
      enum:
        - REQUEST_ACCEPTED
        - POINTS_CLOUD_PRE_PROCESSING
        - GEOMETRY_CONSTRUCTION
        - POST_PROCESSING
    CityJSONRequest:
      deprecated: true
      type: object
      allOf:
        - $ref: '#/components/schemas/CreateCityJSONRequest'
      properties:
        status:
          $ref: '#/components/schemas/CityJSONRequestStatus'
        cityJsons:
          type: array
          items:
            $ref: '#/components/schemas/CityJSON'
    CityJsonFileUrl:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
    CityJSON:
      deprecated: true
      allOf:
        - $ref: '#/components/schemas/CityJsonFileUrl'
    DelimitationType:
      type: string
      description: |
        By default delimitation type is PARCEL_FREE_DELIMITATION, earlier known as *ZONE* delimitation type.
        PARCEL_FREE_DELIMITATION, earlier known as *ZONE* delimitation, supported any BP models, permits consumer to provide either point/polygon/multi-polygon geometry
        USER_DEFINED_DELIMITATION, earlier known as *ROOF* delimitation, only supported with BP_TOITURE model for now, allows consumer to provide define delimitation (eg. roof for BP_TOITURE model), so API does not have to search for its inside provided zone;
        PARCEL_CONSTRAINED_DELIMITATION, earlier known as *PARCEL* delimitation, only supported with BP_TOITURE and BP_VEGETATION models for now, allows consumer to exclude parcels for each zone provided.
      enum:
        - USER_DEFINED_DELIMITATION
        - PARCEL_FREE_DELIMITATION
        - PARCEL_CONSTRAINED_DELIMITATION
        - ROOF
        - ZONE
        - PARCEL
    GeoJsonOutput:
      type: string
      description: |
        By default, detection output is a single GEO_JSON file, which can be displayed on a map such as QGIS, representing a single layer.
        If consumers want to separate result into multiple layers, a ZIP-compressed version is available, with each file representing a specific identified object and its corresponding map layer.
      enum:
        - GEO_JSON
        - ZIP
    ImageUsage:
      type: string
      enum:
        - ROOF_DAMAGE_DETECTION
        - UNKNOWN