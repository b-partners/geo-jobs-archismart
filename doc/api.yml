  responses:
    400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestException'
    403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotAuthorizedException'
    404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceNotFoundException'
    429:
      description: Too many requests to the API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsException'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerException'
  schemas:
    RoofScore:
      type: object
      description: Represents the overall damage rate score of a roof based on multiple degradation factors.
      properties:
        score:
          type: number
          description: Overall roof degradation score, expressed as a percentage between 0 (best) and 100 (worst).
        category:
          $ref: "#/components/schemas/RoofScoreCategory"

    RoofScoreCategory:
      type: string
      description: "Classification of the roof damage rate based on the computed score. (A. best, E. worst)"
      enum:
        - "A"
        - "B"
        - "C"
        - "D"
        - "E"

    RevokedApiKey:
      allOf:
        - $ref: "#/components/schemas/RevokeApiKey"
      properties:
        revokedAt:
          type: string
          format: date-time

    RevokeApiKey:
      type: object
