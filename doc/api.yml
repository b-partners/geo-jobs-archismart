  responses:
    400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestException'
    403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotAuthorizedException'
    404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceNotFoundException'
    429:
      description: Too many requests to the API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsException'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerException'
  schemas:
    RoofScore:
      type: object
      description: Represents the overall damage rate score of a roof based on multiple degradation factors.
      properties:
        score:
          type: number
          description: Overall roof degradation score, expressed as a percentage between 0 (best) and 100 (worst).
        category:
          $ref: "#/components/schemas/RoofScoreCategory"

    RoofScoreCategory:
      type: string
      description: "Classification of the roof damage rate based on the computed score. (A. best, E. worst)"
      enum:
        - "A"
        - "B"
        - "C"
        - "D"
        - "E"

    RevokedApiKey:
      allOf:
        - $ref: "#/components/schemas/RevokeApiKey"
      properties:
        revokedAt:
          type: string
          format: date-time

    RevokeApiKey:
      type: object
      properties:
        keyValue:
          type: string
          format: uuid
          example: "32507271-5ebf-467d-beb2-1a243efdb0e5"

    CreateApiKey:
      type: object
      properties:
        consumerName:
          type: string
        consumerEmail:
          type: string
        dashboardApiKey:
          type: string
          description: |
            Dashboard API key to store as is for the created consumer.
            When not provided, the key is retrieved from, or generated in, the BirdIA dashboard.
        consumerType:
          type: string
          enum:
            - INSURANCE
            - COMMUNITY
            - ADMIN
        maxSurface:
          type: number
          description: allowed surface to detect in square degree
        authorizedZones:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizedZone'
        detectableObjectModel:
          deprecated: true
          allOf:
            - $ref: '#/components/schemas/DetectableObjectModel'
        allowedModels:
          type: array
          items:
            $ref: '#/components/schemas/DetectableObjectModel'
        detectableObjectTypes:
          deprecated: true
          type: array
          items:
            $ref: '#/components/schemas/DetectableObjectType'
    ApiKey:
      type: object
      properties:
        key:
          type: string
        creationDatetime:
          type: string
          format: date-time
    AuthorizedZone:
      type: object
      properties:
        name:
          type: string
        zone:
          $ref: '#/components/schemas/MultiPolygon'
    SingleUserInfo:
      type: object
      properties:
        apiKey:
          type: string
        name:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
    RestException:
      type: object
      properties:
        type:
          type: string
        message:
          type: string
    InternalServerException:
      allOf:
        - $ref: '#/components/schemas/RestException'
      example:
        type: InternalServerException
        message: Unexpected error
    BadRequestException:
      allOf:
        - $ref: '#/components/schemas/RestException'
      example:
        type: BadRequestException
        message: Bad request
    NotAuthorizedException:
      allOf:
        - $ref: '#/components/schemas/RestException'
      example:
        type: NotAuthorizedException
        message: Not authorized
    ResourceNotFoundException:
      allOf:
        - $ref: '#/components/schemas/RestException'
      example:
        type: ResourceNotFoundException
        message: Resource of type <T> identified by <I> not found
    TooManyRequestsException:
      allOf:
        - $ref: '#/components/schemas/RestException'
      example:
        type: TooManyRequestsException
        message: Too many requests
    Page:
      type: integer
      description: Start at `1`
    PageSize:
      type: integer
      description: Cannot exceed `500`
    GeoServerProperties:
      type: object
      properties:
        geoServerUrl:
          type: string
        geoServerParameter:
          $ref: "#/components/schemas/GeoServerParameter"
    CreateZoneTilingJob:
      allOf:
        - $ref: '#/components/schemas/GeoServerProperties'
      properties:
        emailReceiver:
          type: string
          description: |
            Email address that will be notified about detection steps evolution
        zoneName:
          type: string
          description: |
            Name that consumers provide to identify the zone
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
        zoomLevel:
          type: string
          enum:
            - WORLD_0
            - WORLD_1
            - WORLD_2
            - CONTINENT_0
            - CONTINENT_1
            - COUNTRIES
            - COUNTRY
            - STATES
            - COUNTIES_0
            - COUNTIES_1
            - COUNTY
            - METROPOLITAN_AREA
            - CITIES
            - CITY
            - TOWN
            - NEIGHBORHOOD
            - STREETS
            - CITY_BLOCK
            - BUILDINGS
            - BUILDING
            - HOUSES_0
            - HOUSES_1
            - HOUSES_2
            - HOUSE_PROPERTY
    ImageZoomLevel:
      type: string
      enum:
        - BUILDING
        - NEIGHBORHOOD
        - DISTRICT
    RevokeApiKeyResponse:
      type: object
      properties:
        message:
          type: string
    DetectionSurfaceUnit:
      type: string
      x-enum-varnames:
        - SQUARE_METER
        - SQUARE_DEGREE
      enum:
        - SQUARE_METER
        - SQUARE_DEGREE
    DetectionSurfaceValue:
      type: object
      required:
        - value
        - unit
      properties:
        value:
          type: number
          format: double
        unit:
          $ref: '#/components/schemas/DetectionSurfaceUnit'
    DetectionUsage:
      type: object
      required:
        - totalUsedSurface
        - remainingSurface
        - lastDatetimeSurfaceUsage
        - maxAuthorizedSurface
      properties:
        maxAuthorizedSurface:
          $ref: '#/components/schemas/DetectionSurfaceValue'
        totalUsedSurface:
          $ref: '#/components/schemas/DetectionSurfaceValue'
        remainingSurface:
          $ref: '#/components/schemas/DetectionSurfaceValue'
        lastDatetimeSurfaceUsage:
          type: string
          format: date-time
    AnnotationJobProcessing:
      type: object
      properties:
        jobId:
          type: string
        jobType:
          $ref: '#/components/schemas/JobType'
        annotationWithObjectTruePositive:
          type: string
        annotationWithObjectFalsePositive:
          type: string
        annotationWithoutObjectJobId:
          type: string
        creationDatetime:
          type: string
          format: date-time
    FilteredDetectionJob:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/SuccessStatus'
        job:
          $ref: '#/components/schemas/ZoneDetectionJob'
    FilteredTilingJob:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/SuccessStatus'
        job:
          $ref: '#/components/schemas/ZoneTilingJob'
    ImportZoneTilingJob:
      type: object
      properties:
        createZoneTilingJob:
          $ref: '#/components/schemas/CreateZoneTilingJob'
        #TODO: must be oneOf but for now, only from S3 bucket is implemented
        bucketName:
          type: string
        bucketPathPrefix:
          type: string
        startFrom:
          type: number
        endAt:
          type: number
        bucketSeparator:
          $ref: '#/components/schemas/BucketSeparatorType'
    ZoneTilingJob:
      allOf:
        - $ref: "#/components/schemas/CreateZoneTilingJob"
      properties:
        id:
          type: string
        creationDatetime:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/Status"

    CreateZoneDetectionJob:
      type: object
      properties:
        emailReceiver:
          type: string
        zoneName:
          type: string
        zoneTilingJobId:
          type: string
        type:
          $ref: '#/components/schemas/ZoneDetectionType'
        objectsToDetect:
          type: array
          items:
            $ref: "#/components/schemas/DetectableObjectConfiguration"
    ZoneDetectionJob:
      allOf:
        - $ref: "#/components/schemas/CreateZoneDetectionJob"
      properties:
        id:
          type: string
        creationDatetime:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/Status"
    ZoneDetectionType:
      enum:
        - MACHINE
        - HUMAN
    DetectableObjectConfiguration:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/DetectableObjectType"
        confidence:
          type: number
          description: between 0 and 1
        bucketStorageName:
          type: string
          description: |
            Bucket where are stores images to be detected. 
            If null is provided, the default apps bucket is chosen.
    DetectableObjectType:
      type: string
