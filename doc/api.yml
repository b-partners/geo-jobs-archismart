    ###########################################################################################################
    ###  GeoJSON objects. Modified from: https://gist.github.com/bubbobne/fe5f2db65acf039be6a9fd92fc9c7233  ###
    ###########################################################################################################
    GeoServerParameter:
      type: object
      properties:
        service:
          type: string
        request:
          type: string
        layers:
          type: string
        precisionLevelInCm:
          type: integer
        styles:
          type: string
        format:
          type: string
        transparent:
          type: boolean
        version:
          type: string
        width:
          type: integer
        height:
          type: integer
        srs:
          type: string

    Feature:
      type: object
      properties:
        type:
          type: string
          enum: [ Feature ]
        geometry:
          oneOf:
            - $ref: '#/components/schemas/Point'
            - $ref: '#/components/schemas/Polygon'
            - $ref: '#/components/schemas/MultiPolygon'
        properties:
          type: object
          additionalProperties: true
    Geometry:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - Point
            - Polygon
            - MultiPolygon

    Point2D:
      type: array
      maxItems: 2
      minItems: 2
      items:
        type: number

    Point:
      type: object
      allOf:
        - $ref: "#/components/schemas/Geometry"
      properties:
        coordinates:
          $ref: '#/components/schemas/Point2D'

    Polygon:
      type: object
      allOf:
        - $ref: "#/components/schemas/Geometry"
      properties:
        coordinates:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/Point2D'

    MultiPolygon:
      type: object
      allOf:
        - $ref: "#/components/schemas/Geometry"
      properties:
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                $ref: '#/components/schemas/Point2D'
    GeoJsonsUrl:
      type: object
      properties:
        url:
          type: string
        status:
          $ref: "#/components/schemas/Status"
    BucketSeparatorType:
      type: string
      enum:
        - UNDERSCORE
        - SLASH
    DetectionStepName:
      type: string
      enum:
        - REQUEST_ACCEPTED
        - TILING
        - MACHINE_DETECTION
        - POST_PROCESSING
    DetectionStepStatistic:
      allOf:
        - $ref: '#/components/schemas/StatusStatistic'
    DetectableObjectModel:
      type: object
      properties:
        modelName:
          $ref: '#/components/schemas/ModelName'
    ModelName:
      type: string
      description: |
        Possible values and included objects :
          - **BP_TOITURE** : Toiture, velux, panneau photovoltaique, moisissure, usure, fissure cassure, obstacle, cheminee, humidite, risque feu, ombre
          - **BP_LOM** : Passage piéton
          - **BP_ZAN** : Arbre, espace vert, toiture, voie carrossable, trottoir, parking
          - **BP_CLIMAT_RESILIENCE** : Parking, panneau photovoltaique
          - **BP_CONFIRMITE_PLU** : Bati, velux, panneau photovoltaique, Piscine
          - **BP_VOIRIE_TROTTOIRS** : Trottoir, voie carrossable
          - **BP_OLD** : Arbre, espace vert, toiture, voie carrossable, trottoir, parking, risquefeu
          - **BP_CYCL** : Pistes cyclables, symboles cyclables 
          - **BP_SIGN** : Marquages voiries
          - **BP_VEGETATION** : Espace vert, Espace arboré, arbre individualisé, canopée
          - **BP_TAMPONS** : Tampons de voiries, avaloirs, tampons hydroliques
          - **BP_CIMETIERE** : Cimetière, espace arboré, espace vert, tombe simple, tombe double, tombe non géométrique
          - **BP_STATIONNEMENT** : Parking, Place standard
          - **BP_REVETEMENT_OBSTACLE** : Obstacle, cheminee, velux, panneau photovoltaique, lumineux. Supports imagery layers of 5 cm and 20 cm
      enum:
        - BP_TOITURE
        - BP_LOM
        - BP_ZAN
        - BP_CLIMAT_RESILIENCE
        - BP_CONFIRMITE_PLU
        - BP_VOIRIE_TROTTOIRS
        - BP_OLD
        - BP_CYCL
        - BP_SIGN
        - BP_VEGETATION
        - BP_TAMPONS
        - BP_CIMETIERE
        - BP_STATIONNEMENT
        - BP_REVETEMENT_OBSTACLE
